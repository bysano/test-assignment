include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.config.dart"
    # Supplied with the assignment; not ours to lint.
    - "Finonex home assignment July 2026/**"
  errors:
    # Generated DI registration is not const-friendly.
    prefer_const_constructors: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
