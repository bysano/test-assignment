name: pulse_native
description: "Platform channels for Pulse: secure token storage and network reachability."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # Only iOS is implemented. Adding Android means adding an `android:`
      # entry here plus Kotlin classes — no Dart-side changes, because the
      # public API in lib/src is platform-agnostic.
      ios:
        pluginClass: PulseNativePlugin
