name: pulse
description: "Pulse — a live market watchlist over a deliberately unreliable SSE feed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management. BLoCs only — no Cubits (see NOTES.md).
  flutter_bloc: ^9.1.1

  # Dependency injection.
  get_it: ^9.2.1
  injectable: ^2.7.1

  # REST calls (/login, /instruments). The SSE stream deliberately uses
  # dart:io HttpClient instead — see the watchlist feature's data/sse folder.
  http: ^1.6.0

  # Per-instrument decimal formatting.
  intl: ^0.20.3

  equatable: ^2.1.0
  cupertino_icons: ^1.0.8

  # Our own platform channels: Keychain-backed token storage and
  # NWPathMonitor reachability. No flutter_secure_storage / connectivity_plus.
  pulse_native:
    path: packages/pulse_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  injectable_generator: ^2.11.1

  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  # Connection-lifecycle tests run on virtual time.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
